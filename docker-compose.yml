services:

  # ─── Base de données PostgreSQL ───────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: cyberlearn_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberlearn}
      POSTGRES_USER: ${POSTGRES_USER:-cyberlearn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cyberlearn_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberlearn_user} -d ${POSTGRES_DB:-cyberlearn}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Cache Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cyberlearn_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - cyberlearn_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend FastAPI ───────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: cyberlearn_api
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cyberlearn_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cyberlearn}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-cyberlearn_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cyberlearn}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:3001"]}
      - AI_SERVICE_URL=http://ai:8001
    volumes:
      - ./backend:/app
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - cyberlearn_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Service IA recommandation ─────────────────────────────────────────────
  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cyberlearn_ai
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cyberlearn_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cyberlearn}
    volumes:
      - ai_models:/app/models
    ports:
      - "${AI_PORT:-8001}:8001"
    networks:
      - cyberlearn_net
    depends_on:
      db:
        condition: service_healthy

  # ─── Frontend Next.js ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: cyberlearn_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_APP_NAME=CyberLearn
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - cyberlearn_net
    depends_on:
      - api

  # ─── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cyberlearn_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - cyberlearn_net
    depends_on:
      - api
      - frontend
    profiles:
      - production

# ─── Volumes persistants ───────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  ai_models:
    driver: local

# ─── Réseau interne ────────────────────────────────────────────────────────
networks:
  cyberlearn_net:
    driver: bridge
